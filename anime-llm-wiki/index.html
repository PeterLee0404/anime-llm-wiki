    :root {
      --bg-paper: #FAF7F2;

      --text-ink: #1E242B;

      --accent-frieren: #2D6A4F;
      --accent-stone: #B45309;
      --accent-primary: #2D6A4F;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-ink);
      font-family: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
      line-height: 1.65;
    }

    .serif-title {
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
    }

    .hairline {
      border-color: var(--border-hairline);
    }

    .magazine-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-hairline);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .magazine-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px -10px rgba(30, 36, 43, 0.12);
      border-color: #C9BFAE;
    }

    .wikilink-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
      background-color: var(--bg-subtle);
      color: var(--text-ink);
      border: 1px solid var(--border-hairline);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .wikilink-chip:hover {
      background-color: #E8DFD1;
      border-color: #B8AC99;
    }

    .tab-btn {
      position: relative;
      padding: 0.6rem 0.9rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: 0.5rem;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text-ink);
      background-color: var(--bg-subtle);
    }

    .tab-btn.active {
      color: var(--text-ink);
      background-color: #FFFFFF;
      box-shadow: 0 1px 3px rgba(30, 36, 43, 0.08);
      border: 1px solid var(--border-hairline);
    }

    .spoiler-box[open] summary {
      border-bottom: 1px solid #F3D9B1;
    }

    math {
      font-family: "Cambria Math", "Latin Modern Math", "STIX Two Math", serif;
      font-size: 1.02em;
    }

    function matchesQuery(text) {
      if (!searchQuery.trim()) return true;
      return text.toLowerCase().includes(searchQuery.trim().toLowerCase());
    }

        </details>

        <div class="pt-3 border-t hairline text-xs text-[#5A6572]">
          <span class="font-semibold text-[#1E242B]">資料來源：</span>
          ${w.sources.map(src => `<span class="inline-block bg-white border hairline rounded px-2 py-0.5 mr-1 mb-1">[[${src}]]</span>`).join("")}
        </div>
      `;

      const modal = document.getElementById("workModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeWorkModal() {
      const modal = document.getElementById("workModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });
      document.querySelectorAll(".tab-panel").forEach(panel => {
        panel.classList.toggle("hidden", panel.id !== `tab-${tabName}`);
      });
    }

    function renderAll() {
      renderStats();
      renderThemeFilterBar();
      renderWorks();
      renderCreators();
      renderThemes();
      renderIndexAndLog();
    }

    // Event Delegation
    document.addEventListener("click", (e) => {
      const tabBtn = e.target.closest("[data-tab]");
      if (tabBtn) {
        switchTab(tabBtn.dataset.tab);
        return;
      }

      const themeFilterBtn = e.target.closest("[data-theme-filter]");
      if (themeFilterBtn) {
        activeThemeFilter = themeFilterBtn.dataset.themeFilter;
        renderThemeFilterBar();
        renderWorks();
        return;
      }

      const openWorkBtn = e.target.closest("[data-open-work]");
      if (openWorkBtn) {
        openWorkModal(openWorkBtn.dataset.openWork);
        return;
      }

      const jumpThemeBtn = e.target.closest("[data-jump-theme]");
      if (jumpThemeBtn) {
        closeWorkModal();
        switchTab("themes");
        searchQuery = jumpThemeBtn.dataset.jumpTheme;
        document.getElementById("searchInput").value = searchQuery;
        renderAll();
        return;
      }

      const jumpCreatorBtn = e.target.closest("[data-jump-creator]");
      if (jumpCreatorBtn) {
        closeWorkModal();
        switchTab("creators");
        searchQuery = jumpCreatorBtn.dataset.jumpCreator;
        document.getElementById("searchInput").value = searchQuery;
        renderAll();
        return;
      }

      if (e.target.id === "closeModalBtn" || e.target.id === "workModal") {
        closeWorkModal();
      }
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderWorks();
      renderCreators();
      renderThemes();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeWorkModal();
    });

    renderAll();
  </script>
</body>
</html>
